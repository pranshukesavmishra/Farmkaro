name: Deploy to GitHub Pages

on:
  push:
    branches: [main, "claude/farmkaro-saas-platform-0fkefc"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Route handlers are dev-only (offline tile stand-in); a static export
      # has no server, and the public build uses real satellite imagery.
      - run: rm -rf src/app/api
      - run: npx next build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /Farmkaro
      - run: touch out/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/out
